# A workspace that only this Mac can reach. Layered over
# ./compose.yml; setup.mjs places both beside this Caddyfile.
services:
  gateway:
    # Loopback only: nothing on the network can connect.
    ports: !override
      - "127.0.0.1:${SOLOOS_PORT:?set SOLOOS_PORT}:8443"
    volumes:
      - ./certs:/certs:ro
